@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
  --bg: #F4F3EF; --bg2: #E8E6E0; --fg: #0B0B0B; --soft: #2B2A27; --mute: #5F5D58;
  --line: rgba(11, 11, 11, 0.2); --line-strong: rgba(11, 11, 11, 0.5); --dim: rgba(11, 11, 11, 0.28); --ph: rgba(11, 11, 11, 0.45);
  --ring: 11, 11, 11; --red: #D5131B; --on-red: #FFFFFF;
  --logo-full: var(--lg-full-d); --logo-mark: var(--lg-mark-d); --logo-word: var(--lg-word-d);
  color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F4F3EF; --bg2: #E8E6E0; --fg: #0B0B0B; --soft: #2B2A27; --mute: #5F5D58;
  --line: rgba(11, 11, 11, 0.2); --line-strong: rgba(11, 11, 11, 0.5); --dim: rgba(11, 11, 11, 0.28); --ph: rgba(11, 11, 11, 0.45);
  --ring: 11, 11, 11; --red: #D5131B; --on-red: #FFFFFF;
  --logo-full: var(--lg-full-d); --logo-mark: var(--lg-mark-d); --logo-word: var(--lg-word-d);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: auto; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 90; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }
p { margin: 0; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 900; text-transform: uppercase; line-height: .92; margin: 0; text-wrap: balance; letter-spacing: .005em; }
.wrap { width: 100%; max-width: 1240px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
.mute { color: var(--mute); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 500; padding: 14px 22px; border: 1.5px solid var(--fg); background: transparent; color: var(--fg); text-decoration: none; cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
.btn:hover { background: var(--fg); color: var(--bg); }
.btn.red { background: var(--red); border-color: var(--red); color: var(--on-red); }
.btn.red:hover { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.btn.sm { padding: 9px 14px; }
.btn[disabled] { opacity: .55; cursor: default; }
.btn[disabled]:hover { background: transparent; color: var(--fg); }

/* ---------- top bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 80; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; min-width: 0; }
.brand-mark { width: 29px; height: 46px; background: var(--logo-mark) center/contain no-repeat; flex: none; }
.brand-word { height: 40px; aspect-ratio: 2.4247 / 1; background: var(--logo-word) center/contain no-repeat; flex: none; }
.tools { display: flex; align-items: center; gap: 4px; }
.ibtn { display: inline-flex; align-items: center; gap: 12px; height: 46px; min-width: 46px; justify-content: center; padding: 0 12px; background: transparent; border: 0; color: var(--fg); cursor: pointer; font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
.ibtn:hover { color: var(--red); }
.burger { display: grid; gap: 5px; width: 26px; }
.burger i { display: block; height: 2.5px; background: currentColor; }
.ibtn svg { width: 22px; height: 22px; display: block; }

/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 100; background: var(--bg); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.ov-bar { display: flex; align-items: center; justify-content: space-between; padding-block: 8px; border-bottom: 1px solid var(--line); }
.ov-body { padding-block: clamp(24px, 5vw, 56px); }
.ov-body > .mono { color: var(--mute); display: block; margin-bottom: 14px; }
.biglist { list-style: none; margin: 0; padding: 0; }
.biglist a, .biglist button { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; width: 100%; padding: 6px 0; border: 0; background: none; color: var(--fg); font-family: var(--f-display); font-weight: 900; text-transform: uppercase; font-size: clamp(46px, 9vw, 104px); line-height: .98; text-decoration: none; cursor: pointer; text-align: left; }
.biglist a:hover, .biglist button:hover { color: var(--red); }
.biglist .go { font-family: var(--f-mono); font-weight: 400; font-size: 12px; letter-spacing: .14em; color: var(--mute); }
.biglist .sm a { font-size: clamp(34px, 6vw, 64px); }
.back { margin-bottom: 18px; }
.ov-foot { display: flex; flex-wrap: wrap; gap: 8px 28px; margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--line); color: var(--mute); }
.sbox { width: 100%; background: transparent; border: 0; border-bottom: 2px solid var(--fg); color: var(--fg); font-family: var(--f-display); font-weight: 800; text-transform: uppercase; font-size: clamp(34px, 7vw, 84px); padding: 8px 0; outline: none; }
.sbox:focus { border-bottom-color: var(--red); }
.sbox::placeholder { color: var(--ph); }

/* ---------- hero ---------- */

  /* ---------- router ---------- */
  var view = $('#view'), cur = 'home';

    var h = (location.hash || '').replace(/^#/, '') || 'home', html;
    cur = h;
    stopBeat(); closeOv(true); destroyHero();
    if (h === 'home') html = pHome();
    else if (h === 'news') html = pNews();
    else if (h.indexOf('news-') === 0) html = pPost(h.slice(5));
    else if (h === 'about') html = pAbout();
    else if (h === 'artists') html = pArtists();
    else if (h.indexOf('artist-') === 0) html = pArtist(h.slice(7));
    else if (h === 'releases') html = pReleases();
    else if (h.indexOf('release-') === 0) html = pRelease(h.slice(8));
    else if (h === 'videos') html = pVideos();
    else if (h.indexOf('video-') === 0) html = pVideo(h.slice(6));
    else if (h === 'events') html = pEvents();
    else if (h === 'contact') html = pContact();
    else if (h === 'licensing') html = pLicensing();
    else if (h === 'privacy') html = pPrivacy();
    else if (h === 'shop') html = pShop();
    else if (h === 'search') html = pSearch();
    else { cur = 'home'; html = pHome(); h = 'home'; }

    window.scrollTo(0, 0);

  }
  window.addEventListener('hashchange', route);

  $('#artist-links').innerHTML = ARTISTS.map(function (a) { return '<li><a href="#artist-' + a.id + '">' + esc(a.name) + ' <span class="go">Go to artist &rarr;</span></a></li>'; }).join('') + '<li><a href="#artists">All artists <span class="go">&rarr;</span></a></li>';
  $('#btn-menu').addEventListener('click', function () { openOv(menu); });
  $('#btn-search').addEventListener('click', function () { openOv(srch); });

  var oa = $('#open-artists');

  /* ---------- page interactions (delegated) ---------- */

  /* ---------- hero: slider + ripples ---------- */
  var ringRGB = '244,243,239', heroOn = false, hero, cv, cx, rings = [], W = 0, H = 0, dpr = 1, origin = { x: 0, y: 0 }, raf = 0, ro = null, ambient = 0, slideTimer = 0, si = 0;
  function setOrigin() {
    if (!hero) return;

  function spawn(x, y, strong) { if (rings.length > 14) rings.shift(); rings.push({ x: x, y: y, r: 8, max: Math.max(W, H) * (strong ? 0.8 : 0.65), red: !!strong }); }

    if (!heroOn) return;
    cx.clearRect(0, 0, W, H);
    for (var i = rings.length - 1; i >= 0; i--) {
      var g = rings[i]; g.r += 2.4 + g.r * 0.012;
      var a = 1 - g.r / g.max;
      if (a <= 0) { rings.splice(i, 1); continue; }
      cx.lineWidth = g.red ? 2.5 : 1.5;
      cx.strokeStyle = g.red ? 'rgba(236,31,38,' + (a * 0.9) + ')' : 'rgba(' + ringRGB + ',' + (a * 0.24) + ')';
      cx.beginPath(); cx.arc(g.x, g.y, g.r, 0, 6.2832); cx.stroke();
    }
    raf = requestAnimationFrame(frame);
  }
  function show(n) {
    var slides = $$('.slide', hero), dots = $$('[data-dot]', hero);
    si = (n + slides.length) % slides.length;
    slides.forEach(function (s, i) { s.classList.toggle('on', i === si); });
    dots.forEach(function (d, i) { if (i === si) d.setAttribute('aria-current', 'true'); else d.removeAttribute('aria-current'); });
    setOrigin();
    if (!reduce && heroOn) spawn(origin.x, origin.y, true);
  }
  function startTimer() { clearInterval(slideTimer); if (!reduce) slideTimer = setInterval(function () { show(si + 1); }, 7000); }
  function initHero() {
    hero = $('#hero'); if (!hero) return;
    cv = $('#ripples'); cx = cv.getContext('2d'); heroOn = true; rings = []; si = 0;
    size();
    if (window.ResizeObserver) { ro = new ResizeObserver(size); ro.observe(hero); }
    hero.addEventListener('click', function (e) {
      var d = e.target.closest('[data-dot]'); if (d) { show(+d.getAttribute('data-dot')); startTimer(); return; }
      if (e.target.closest('[data-prev]')) { show(si - 1); startTimer(); return; }
      if (e.target.closest('[data-next]')) { show(si + 1); startTimer(); return; }
      if (e.target.closest('a, button') || reduce) return;
      var r = hero.getBoundingClientRect(); spawn(e.clientX - r.left, e.clientY - r.top, true);
    });
    hero.addEventListener('mouseenter', function () { clearInterval(slideTimer); });
    hero.addEventListener('mouseleave', startTimer);
    if (reduce) { drawStatic(); return; }
    spawn(origin.x, origin.y, true);
    ambient = setInterval(function () { spawn(origin.x, origin.y, false); }, 1900);
    raf = requestAnimationFrame(frame);
    startTimer();
  }
  function destroyHero() {
    heroOn = false; cancelAnimationFrame(raf); clearInterval(ambient); clearInterval(slideTimer);
    if (ro) { ro.disconnect(); ro = null; }
    hero = null;
  }
  window.addEventListener('resize', function () { if (heroOn) size(); });
  window.addEventListener('kick', function () { if (heroOn && !reduce) spawn(origin.x, origin.y, true); });

  /* ---------- beat sketches (synthesized in the browser, no audio files) ---------- */
  var PAT = {
    afro:  { bpm: 108, kick: '1000001000100000', snare: '0000100000001001', hat: '1011101110111011', bass: [55, 0, 0, 0, 0, 0, 65.4, 0, 0, 0, 82.4, 0, 0, 0, 0, 0] },
    afro2: { bpm: 102, kick: '1000000100100000', snare: '0000100000001000', hat: '1010101110101011', bass: [49, 0, 0, 0, 0, 0, 0, 58.3, 0, 0, 73.4, 0, 0, 0, 0, 0] },
    rap:   { bpm: 90,  kick: '1000001000100000', snare: '0000100000001000', hat: '1010101010101011', bass: [49, 0, 0, 0, 0, 0, 55, 0, 0, 0, 49, 0, 0, 0, 0, 0] },
    trap:  { bpm: 140, kick: '1000000000100100', snare: '0000000010000000', hat: '1111111111111111', bass: [41.2, 0, 0, 0, 0, 0, 0, 0, 0, 0, 36.7, 0, 0, 0, 0, 0] }
  };
  var ac = null, master = null, noiseBuf = null, bt = null, stepI = 0, nextT = 0, genre = null, curBtn = null;
  function initAudio() {
    if (ac) return;
    var AC = window.AudioContext || window.webkitAudioContext; ac = new AC();
    var comp = ac.createDynamicsCompressor(); master = ac.createGain(); master.gain.value = 0.8;
    master.connect(comp); comp.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
    var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function kick(t) { var o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.14); g.gain.setValueAtTime(0.95, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.4); o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.42); }
  function noise(t, f, type, vol, dur) { var s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = noiseBuf; fl.type = type; fl.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); s.connect(fl); fl.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02); }
  function snare(t) { noise(t, 1900, 'bandpass', 0.55, 0.2); var o = ac.createOscillator(), g = ac.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(210, t); o.frequency.exponentialRampToValueAtTime(130, t + 0.1); g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.14); o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.16); }
  function bass(t, f, len) { var o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.7, t + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + len); o.connect(g); g.connect(master); o.start(t); o.stop(t + len + 0.02); }
  function tick() {
    var p = PAT[genre], sl = 60 / p.bpm / 4;
    while (nextT < ac.currentTime + 0.12) {
      var i = stepI % 16;
      if (p.kick[i] === '1') { kick(nextT); (function (ms) { setTimeout(function () { if (genre) window.dispatchEvent(new Event('kick')); }, ms); })(Math.max(0, (nextT - ac.currentTime) * 1000)); }
      if (p.snare[i] === '1') snare(nextT);
      if (p.hat[i] === '1') noise(nextT, 7500, 'highpass', genre === 'trap' ? 0.11 : 0.16, 0.05);
      if (p.bass[i]) bass(nextT, p.bass[i], sl * (genre === 'trap' ? 7 : 3.2));
      nextT += sl; stepI++;
    }
  }
  function stopBeat() {
    clearInterval(bt); bt = null; genre = null;
    $$('.play[aria-pressed="true"]').forEach(function (b) {
      b.setAttribute('aria-pressed', 'false');
      var l = $('.lbl2', b); if (l) l.textContent = b.getAttribute('data-long') || 'Play';
    });
    curBtn = null;
  }
  function startBeat(btn) {
    initAudio(); if (ac.state === 'suspended') ac.resume();
    genre = btn.getAttribute('data-play'); curBtn = btn; stepI = 0; nextT = ac.currentTime + 0.06;
    var l = $('.lbl2', btn); btn.setAttribute('data-long', l.textContent); l.textContent = 'Stop';
    btn.setAttribute('aria-pressed', 'true');
    bt = setInterval(tick, 25);
  }

  /* ---------- light / dark mode ---------- */
  var root = document.documentElement, tbtn = $('#btn-theme');
  var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>';
  function effTheme() {
    var t = root.getAttribute('data-theme');
    if (t === 'light' || t === 'dark') return t;
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  }
  function syncTheme() {
    var t = effTheme();
    tbtn.innerHTML = t === 'dark' ? SUN : MOON;
    tbtn.setAttribute('aria-label', t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
    try { var v = getComputedStyle(root).getPropertyValue('--ring').trim(); if (v) ringRGB = v.replace(/\s+/g, ''); } catch (e) {}
    if (reduce && heroOn) drawStatic();
  }
  try { var saved = localStorage.getItem('ripple-theme'); if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved); } catch (e) {}
  tbtn.addEventListener('click', function () {
    var next = effTheme() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('ripple-theme', next); } catch (e) {}

  });
  try { new MutationObserver(syncTheme).observe(root, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
  try { var mq = window.matchMedia('(prefers-color-scheme: light)'); if (mq.addEventListener) mq.addEventListener('change', syncTheme); } catch (e) {}
  syncTheme();

  route();
})();
